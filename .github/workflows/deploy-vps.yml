name: Deploy 9Router to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

# Runs on the SELF-HOSTED runner (vps-9router-prod) on the VPS, as the
# non-root "9router" user. No SSH keys — the agent runs locally.
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build + deploy
        run: |
          set -euo pipefail
          # Build from the runner's checkout (GITHUB_WORKSPACE)
          VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "([^"]+)".*/\1/')
          echo "  version: $VERSION"
          docker build -t 9router:$VERSION .
          # Update compose tag + bring up (in the persistent app dir)
          cd /opt/9router
          sed -i "s|image: 9router:.*|image: 9router:$VERSION|" docker-compose.yml
          docker compose up -d
          docker image prune -f >/dev/null 2>&1 || true
          echo "deploy complete: 9router:$VERSION"
