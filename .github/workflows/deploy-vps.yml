name: Deploy 9Router to VPS

on:
  push:
    branches: [production]
  workflow_dispatch:

# Build+deploy split (Option B):
#   - BUILD job runs on GitHub's hosted runner (ubuntu-latest) — build CPU is
#     off the VPS entirely. Pushes to GHCR.
#   - DEPLOY job runs on GitHub's hosted runner too and reaches the VPS over SSH
#     as the non-root "9router" user (docker group, no sudo). That user's key is
#     pinned to one forced command (/opt/9router/deploy.sh) with sshd `restrict`,
#     so the key can deploy and nothing else.
#
# NOTE: there are NO self-hosted runners on this account and none may be added
# (all 14 were deleted 2026-09-26). The old `runs-on: self-hosted` deploy job
# queued forever and every release had to be deployed by hand.
#
# NOTE: builds from the PRODUCTION branch (the fork's custom code), NOT master
# (master is upstream v0.5.59 + CI only, no custom code).

env:
  IMAGE: ghcr.io/ming997hk/9router

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: ver
        run: |
          VERSION=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "  version: $VERSION"

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Two pushes in a row must not race pull/up on the same compose project.
    concurrency:
      group: deploy-9router-prod
      cancel-in-progress: false
    steps:
      - name: Install deploy key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 187.52.117.13 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull + restart on VPS
        run: |
          set -euo pipefail
          # The key is pinned to /opt/9router/deploy.sh, so no command is sent;
          # sshd runs the script and streams its output here.
          ssh -i ~/.ssh/id_deploy \
              -o BatchMode=yes -o ConnectTimeout=15 \
              9router@187.52.117.13

      - name: Verify live health
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --max-time 15 \
            https://9router.cloudcraft.biz/api/health
          echo
          curl -fsS --max-time 15 https://9router.cloudcraft.biz/api/version
