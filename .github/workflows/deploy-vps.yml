name: Deploy 9Router to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy via restricted SSH key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The SSH key is locked on the VPS to a forced command
          # (command="/usr/local/bin/9router-deploy.sh"), so this key CANNOT
          # run arbitrary shell. The wrapper does git pull -> docker build ->
          # docker compose up. We send a trivial no-op command here; the
          # forced command intercepts it and runs the wrapper.
          script: "deploy-9router"
